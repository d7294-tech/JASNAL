<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b5d42" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>FC 우리풋살</title>
  <style>
    :root{
      --green:#0b5d42;
      --green-dark:#083b2d;
      --green-soft:#e8f4ef;
      --line:#e5e7eb;
      --bg:#f7f8fa;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --morning:#e6f2ff;
      --afternoon:#fff1d6;
      --off:#f1f2f4;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    .app{
      width:100%;
      max-width:520px;
      margin:0 auto;
      min-height:100vh;
      background:var(--bg);
      padding:14px 14px 86px;
    }
    .screen{display:none}
    .screen.active{display:block}
    .hero{
      background:linear-gradient(135deg,var(--green),var(--green-dark));
      color:#fff;
      border-radius:20px;
      padding:20px;
      margin-bottom:14px;
    }
    .hero h1{font-size:22px;margin:0 0 4px}
    .hero p{margin:0;opacity:.85;font-size:14px}
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:18px;
      padding:16px;
      margin-bottom:14px;
    }
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .title{font-size:18px;font-weight:800}
    .sub{font-size:13px;color:var(--muted)}
    .pill{
      border-radius:999px;
      background:var(--green-soft);
      color:var(--green-dark);
      padding:6px 10px;
      font-size:12px;
      font-weight:700;
    }
    .vote-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
      margin-top:14px;
    }
    .vote{
      min-height:62px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:14px;
      font-weight:700;
    }
    .vote.active{background:var(--green-soft);border-color:var(--green)}
    .home-link{
      width:100%;
      text-align:left;
      border:1px solid var(--line);
      background:#fff;
      border-radius:18px;
      padding:16px;
      margin-bottom:14px;
    }
    .nav{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom:0;
      width:min(520px,100%);
      background:#fff;
      border-top:1px solid var(--line);
      display:grid;
      grid-template-columns:repeat(5,1fr);
      z-index:20;
      padding-bottom:env(safe-area-inset-bottom);
    }
    .nav button{
      min-height:64px;
      border:0;
      background:#fff;
      font-size:12px;
      color:var(--muted);
    }
    .nav button.active{color:var(--green);font-weight:800}
    .nav .ico{display:block;font-size:19px;margin-bottom:4px}
    .month-head{
      display:grid;
      grid-template-columns:48px 1fr 48px;
      align-items:center;
      margin-bottom:10px;
    }
    .month-head button{
      min-height:44px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      font-size:24px;
    }
    .month-head h2{margin:0;text-align:center;font-size:19px}
    .calendar{
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      background:#fff;
    }
    .week,.cal{
      display:grid;
      grid-template-columns:repeat(7,minmax(0,1fr));
    }
    .week div{
      padding:9px 2px;
      text-align:center;
      font-size:12px;
      font-weight:800;
      background:#fafafa;
      border-bottom:1px solid var(--line);
    }
    .sun,.sat{color:#dc2626}
    .fri{color:#2563eb}
    .day{
      min-height:82px;
      border:0;
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      background:#fff;
      padding:4px;
      text-align:left;
      position:relative;
    }
    .day:nth-child(7n){border-right:0}
    .day.blank{background:#fafafa}
    .day.selected{outline:2px solid var(--green);outline-offset:-2px}
    .day-num{font-size:12px;font-weight:800;margin-bottom:3px}
    .tag{
      display:block;
      font-size:9px;
      line-height:1.2;
      border-radius:5px;
      padding:2px 3px;
      margin-top:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .morning{background:var(--morning)}
    .afternoon{background:var(--afternoon)}
    .off{background:var(--off)}
    .dot{
      position:absolute;top:6px;right:6px;
      width:6px;height:6px;border-radius:50%;
      background:var(--green);
    }
    .field{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      background:#fafafa;
      border-radius:12px;
      padding:10px 12px;
      margin-top:8px;
    }
    .field select{
      min-width:110px;
      font-size:16px;
      border:1px solid var(--line);
      background:#fff;
      border-radius:10px;
      padding:10px;
    }
    .primary{
      width:100%;
      border:0;
      border-radius:12px;
      background:var(--green);
      color:#fff;
      padding:13px;
      font-weight:800;
      margin-top:12px;
    }
    .secondary{
      border:1px solid var(--line);
      background:#fff;
      border-radius:12px;
      padding:10px 12px;
      font-weight:700;
    }
    .match-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
    .match-tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:800}
    .match-tab.active{background:var(--green-soft);border-color:var(--green);color:var(--green-dark)}
    .list{display:grid;gap:10px}
    .list-item{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;
    }
    .form{
      display:none;
      margin-top:12px;
    }
    .form.show{display:block}
    .form label{display:block;font-size:13px;font-weight:700;margin-top:10px}
    .form input{
      width:100%;
      margin-top:5px;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      font-size:16px;
      background:#fff;
    }
    .search{
      width:100%;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      font-size:16px;
      background:#fff;
      margin-bottom:10px;
    }
    .menu button{
      width:100%;
      border:0;
      border-bottom:1px solid var(--line);
      background:#fff;
      text-align:left;
      padding:16px;
    }
    .menu button:last-child{border-bottom:0}
    @media (max-width:380px){
      .app{padding-left:10px;padding-right:10px}
      .day{min-height:76px;padding:3px}
      .tag{font-size:8px}
    }

    .modal-backdrop{
      position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
      align-items:flex-end;justify-content:center;z-index:50;padding:12px;
    }
    .modal-backdrop.show{display:flex}
    .modal{
      width:min(520px,100%);background:var(--card);border-radius:20px 20px 14px 14px;
      border:1px solid var(--line);padding:16px;max-height:88vh;overflow:auto;
    }
    .modal h3{margin:0 0 12px;font-size:18px}
    .modal .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .danger{background:#7f1d1d!important;color:#fff!important;border:0!important}
    .match-actions{display:flex;gap:8px;margin-top:10px}
    .delete-pick{display:none;width:100%;margin-top:10px;border:1px solid #7f1d1d;background:transparent;color:#f87171;border-radius:12px;padding:10px;font-weight:800}
    .delete-mode .delete-pick{display:block}
    .attendance-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
    .attendance-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;font-size:12px;font-weight:800}
    .attendance-btn.active{background:var(--green-soft);border-color:var(--green);color:var(--green-dark)}
    .attendance-btn:disabled{opacity:.55;cursor:not-allowed}
    .attendance-note{font-size:11px;color:var(--muted);margin-top:7px}
    .attendance-view-btn{width:100%;margin-top:8px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:800}
    .vote-list-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
    .vote-list-section{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
    .vote-list-title{font-weight:800;margin-bottom:8px}
    .vote-name-list{display:flex;flex-wrap:wrap;gap:6px}
    .vote-name{font-size:12px;padding:5px 8px;border-radius:999px;background:#f3f4f6}
    .vote-empty{font-size:12px;color:var(--muted)}
    .member-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
    .member-chip{font-size:11px;padding:4px 8px;border-radius:999px;background:#f3f4f6;color:var(--text)}
    .member-card-actions{display:flex;gap:8px;margin-top:10px}
    .member-card-actions button{flex:1}
    .member-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
    .sync-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
    .sync-status{font-size:12px;color:var(--muted);margin-top:8px}
    .sync-ok{color:#059669}.sync-bad{color:#dc2626}
    .auth-panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
    .auth-user{font-size:13px;color:var(--muted);margin-top:4px}
    .auth-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .profile-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--green-soft);color:var(--green-dark);font-size:11px;font-weight:800;margin-top:6px}
    .pending-badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:11px;font-weight:800;margin-top:6px}
    .approval-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .match-actions button{flex:1}
  </style>
</head>
<body>
  <main class="app">
    <section id="home" class="screen active">
      <div class="hero">
        <h1>FC 우리풋살</h1>
        <p>함께 뛰는 즐거움</p>
      </div>

      <div class="card">
        <div class="row">
          <div>
            <div class="sub">다음 경기</div>
            <div id="homeNextMatchTitle" class="title" style="margin-top:4px">등록된 경기가 없습니다.</div>
          </div>
          <span id="homeNextMatchDday" class="pill" style="display:none"></span>
        </div>
        <div id="homeNextMatchPlace" class="sub" style="margin-top:6px"></div>
        <div class="vote-grid">
          <button class="vote" data-vote="참석">참석<br><strong>12</strong></button>
          <button class="vote" data-vote="불참">불참<br><strong>3</strong></button>
          <button class="vote" data-vote="미정">미정<br><strong>5</strong></button>
        </div>
        <div id="voteMsg" class="sub" style="margin-top:10px">참석 여부를 선택하세요.</div>
        <button id="homeVoteListBtn" class="attendance-view-btn" type="button">투표 인원 보기</button>
      </div>

      <button class="home-link" data-go="calendar">
        <div class="row">
          <div>
            <div class="title" style="font-size:16px">오늘 그룹 스케줄</div>
            <div class="sub" style="margin-top:5px">4근 2휴 자동 패턴 적용</div>
          </div>
          <span style="font-size:22px">›</span>
        </div>
      </button>

      <div class="card">
        <div class="title" style="font-size:16px;margin-bottom:12px">공지사항</div>
        <div class="row" style="margin-bottom:10px"><span>11월 정기 경기 안내</span><span class="sub">10.25</span></div>
        <div class="row"><span>풋살장 변경 안내</span><span class="sub">10.20</span></div>
      </div>
    </section>

    <section id="calendar" class="screen">
      <div class="month-head">
        <button id="prevMonth" aria-label="이전 달">‹</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth" aria-label="다음 달">›</button>
      </div>

      <div class="calendar">
        <div class="week">
          <div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div class="fri">금</div><div class="sat">토</div>
        </div>
        <div id="calendarGrid" class="cal"></div>
      </div>

      </section>

    
    <section id="matches" class="screen">
      <div class="row" style="margin-bottom:12px">
        <div>
          <div class="title">경기일정</div>
          <div class="sub" style="margin-top:4px">등록한 경기는 캘린더에 자동 표시됩니다.</div>
        </div>
        <div style="display:flex;gap:8px">
          <button id="newMatchBtn" class="secondary">+ 경기</button>
          <button id="deleteModeBtn" class="secondary" type="button">삭제</button>
        </div>
      </div>
      <div class="match-tabs">
        <button id="upcomingMatchTab" class="match-tab active" type="button">예정 경기</button>
        <button id="pastMatchTab" class="match-tab" type="button">지난 경기</button>
      </div>
      <div id="matchList" class="list"></div>
    </section>


    
    <section id="members" class="screen">
      <div class="row" style="margin-bottom:12px">
        <div>
          <div class="title">회원</div>
          <div id="memberCount" class="sub" style="margin-top:4px"></div>
        </div>
        <button id="addMember" class="secondary">+ 회원</button>
      </div>

      <input id="memberSearch" class="search" placeholder="이름 검색">

      <div class="row" style="margin-bottom:10px">
        <select id="memberGroupFilter" class="secondary" style="flex:1;min-height:44px">
          <option value="">전체 그룹</option>
          <option>1그룹</option>
          <option>2그룹</option>
          <option>3그룹</option>
          <option>OFFICE</option>
        </select>
        <select id="memberStatusFilter" class="secondary" style="flex:1;min-height:44px">
          <option value="">전체 상태</option>
          <option>활동중</option>
          <option>승인대기</option>
          <option>휴면</option>
        </select>
      </div>

      <div id="approvalQueue" class="card" style="display:none;margin-bottom:12px">
        <div class="title" style="font-size:16px">가입 승인 대기</div>
        <div id="approvalList" class="list" style="margin-top:10px"></div>
      </div>
      <div id="memberList" class="list"></div>
    </section>


    
    <section id="more" class="screen">
      <div class="card">
        <div class="title">FC 우리풋살</div>
        <div id="moreMemberCount" class="sub" style="margin-top:5px"></div>
      </div>

      <div class="auth-panel">
        <div class="title" style="font-size:16px">내 계정</div>
        <div id="authSignedOut">
          <div class="sub" style="margin-top:4px">로그인하면 투표가 회원 계정 기준으로 저장됩니다.</div>
          <input id="authEmail" class="search" style="margin-top:10px" type="email" placeholder="이메일">
          <input id="authPassword" class="search" type="password" placeholder="비밀번호 (6자 이상)">
          <div class="auth-grid">
            <button id="loginBtn" class="primary" type="button" style="margin-top:0">로그인</button>
            <button id="signupBtn" class="secondary" type="button">회원가입</button>
          </div>
        </div>
        <div id="authSignedIn" style="display:none">
          <div id="authEmailView" class="auth-user"></div>
          <div id="authProfileView"></div>
          <div class="auth-grid">
            <button id="editMyProfileBtn" class="secondary" type="button">내 정보 수정</button>
            <button id="logoutBtn" class="secondary" type="button">로그아웃</button>
          </div>
        </div>
        <div id="authStatus" class="sync-status"></div>
      </div>

      <div id="cloudAdminBox" class="sync-box" style="display:none">
        <div class="title" style="font-size:16px">Cloud 연결</div>
        <div class="sub" style="margin-top:4px">Supabase를 연결하면 다른 휴대폰/PC와 데이터가 자동 공유됩니다.</div>

        <label style="display:block;margin-top:12px;font-size:13px;font-weight:700">Project URL</label>
        <input id="supabaseUrl" class="search" style="margin-top:5px" placeholder="https://xxxx.supabase.co">

        <label style="display:block;font-size:13px;font-weight:700">Anon / Publishable Key</label>
        <input id="supabaseKey" class="search" style="margin-top:5px" placeholder="eyJ...">

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button id="connectSupabase" class="primary" type="button" style="margin-top:0">연결 / 저장</button>
          <button id="disconnectSupabase" class="secondary" type="button">연결 해제</button>
        </div>
        <div id="syncStatus" class="sync-status">현재: 이 기기에만 저장</div>
      </div>

      <div class="card menu" style="padding:0;margin-top:12px">
        <button>구장 정보</button>
        <button>회비 관리</button>
        <button>공지사항</button>
        <button>설정</button>
      </div>
    </section>

  </main>



  <div id="voteListModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="voteListTitle">
      <div class="row">
        <div>
          <h3 id="voteListTitle" style="margin-bottom:4px">투표 인원</h3>
          <div id="voteListMatchInfo" class="sub"></div>
        </div>
        <button id="closeVoteListModal" class="secondary" type="button">닫기</button>
      </div>
      <div class="vote-list-grid">
        <div class="vote-list-section">
          <div id="voteYesTitle" class="vote-list-title">참석 0명</div>
          <div id="voteYesList" class="vote-name-list"></div>
        </div>
        <div class="vote-list-section">
          <div id="voteNoTitle" class="vote-list-title">불참 0명</div>
          <div id="voteNoList" class="vote-name-list"></div>
        </div>
        <div class="vote-list-section">
          <div id="voteMaybeTitle" class="vote-list-title">미정 0명</div>
          <div id="voteMaybeList" class="vote-name-list"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="matchModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="matchModalTitle">
      <div class="row">
        <h3 id="matchModalTitle">경기 등록</h3>
        <button id="closeMatchModal" class="secondary" type="button">닫기</button>
      </div>
      <form id="matchForm">
        <input id="matchId" type="hidden">
        <label>경기명<input id="matchTitle" value="정기 경기" required></label>
        <label>날짜<input id="matchDate" type="date" value="2026-11-21" required></label>
        <label>시작 시간<input id="matchTime" type="time" value="20:00" required></label>
        <label>종료 시간<input id="matchEndTime" type="time" value="22:00" required></label>
        <label>장소<input id="matchPlace" value="영종 풋살장 A구장" required></label>
        <label>메모<input id="matchMemo" placeholder="예: 구장비 140,000원 / 19:50 집합"></label>
        <button class="primary" type="submit">저장</button>
      </form>
      <div id="editDeleteWrap" style="display:none">
        <button id="deleteMatchBtn" class="primary danger" type="button">경기 삭제</button>
      </div>
    </div>
  </div>


  <div id="memberModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="memberModalTitle">
      <div class="row">
        <h3 id="memberModalTitle">회원 등록</h3>
        <button id="closeMemberModal" class="secondary" type="button">닫기</button>
      </div>
      <form id="memberForm">
        <input id="memberId" type="hidden"><input id="memberAuthUserId" type="hidden">
        <label>이름<input id="memberName" required placeholder="이름"></label>
        <label>그룹
          <select id="memberGroup" class="search" style="margin-top:5px">
            <option>1그룹</option><option>2그룹</option><option>3그룹</option><option>OFFICE</option>
          </select>
        </label>
        <label>권한
          <select id="memberRole" class="search" style="margin-top:5px">
            <option>회원</option><option>운영진</option><option>관리자</option>
          </select>
        </label>
        <label>상태
          <select id="memberStatus" class="search" style="margin-top:5px">

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const state={
  year:2026,
  month:9,
  selected:'2026-10-01',
  schedule:{},
  events:{},
  matches:[
    {id:1,title:'정기 경기',date:'2026-11-21',time:'20:00',endTime:'22:00',place:'영종 풋살장 A구장',memo:'',attendance:{yes:12,no:3,maybe:5,myVote:null}}
  ],
  members:[
    {id:101,name:'김민수',group:'1그룹',role:'회원',status:'활동중'},
    {id:102,name:'이준호',group:'2그룹',role:'회원',status:'활동중'},
    {id:103,name:'박지훈',group:'3그룹',role:'회원',status:'활동중'},
    {id:104,name:'최영민',group:'1그룹',role:'운영진',status:'활동중'},
    {id:105,name:'정우현',group:'2그룹',role:'회원',status:'활동중'},
    {id:106,name:'한지수',group:'3그룹',role:'회원',status:'활동중'}
  ]
};

const STORAGE_KEY='jasnal_state_v1';

const SB_URL_KEY='jasnal_supabase_url';
const SB_ANON_KEY='jasnal_supabase_anon';
const DEVICE_KEY='jasnal_device_id';
let supabase=null;
let realtimeChannel=null;
let remoteReady=false;
let remoteReloadTimer=null;
let currentUser=null;
let currentMember=null;
function isManager(){
  return currentMember && (currentMember.role==='운영진' || currentMember.role==='관리자') && currentMember.status==='활동중';
}
function isAdmin(){
  return currentMember && currentMember.role==='관리자' && currentMember.status==='활동중';
}
function isApproved(){
  return currentMember && currentMember.status==='활동중';
}



function deviceId(){
  let id=localStorage.getItem(DEVICE_KEY);
  if(!id){
    id=(crypto.randomUUID ? crypto.randomUUID() : 'device-'+Date.now()+'-'+Math.random().toString(16).slice(2));
    localStorage.setItem(DEVICE_KEY,id);
  }
  return id;
}

function setSyncStatus(text, ok=null){
  const el=$('syncStatus');
  if(!el)return;
  el.textContent=text;
  el.classList.remove('sync-ok','sync-bad');
  if(ok===true)el.classList.add('sync-ok');
  if(ok===false)el.classList.add('sync-bad');
}

async function initSupabase(){
  const url=localStorage.getItem(SB_URL_KEY)||'';
  const key=localStorage.getItem(SB_ANON_KEY)||'';
  if($('supabaseUrl'))$('supabaseUrl').value=url;
  if($('supabaseKey'))$('supabaseKey').value=key;

  if(!url || !key){
    supabase=null; remoteReady=false; currentUser=null; currentMember=null;
    setSyncStatus('현재: 이 기기에만 저장');
    renderAuthState();
    return false;
  }

  try{
    supabase=createClient(url,key);
    remoteReady=true;

    const {data:{session}}=await supabase.auth.getSession();
    currentUser=session?.user||null;

    supabase.auth.onAuthStateChange(async (_event,session)=>{
      currentUser=session?.user||null;
      if(currentUser){
        await loadMyMemberProfile();
        await loadRemoteState();
        subscribeRealtime();
      }else{
        currentMember=null;
        if(realtimeChannel && supabase) supabase.removeChannel(realtimeChannel);
        realtimeChannel=null;
      }
      renderAuthState();
      refreshHome();
      renderMatches();
    });

    if(currentUser){
      await loadMyMemberProfile();
      await loadRemoteState();
      subscribeRealtime();
      setSyncStatus('Cloud 연결됨 · 로그인됨',true);
    }else{
      setSyncStatus('Cloud 연결됨 · 로그인 필요',true);
    }
    renderAuthState();
    return true;
  }catch(err){
    console.error(err);
    supabase=null; remoteReady=false;
    setSyncStatus('연결 실패: '+(err?.message||'설정을 확인하세요.'),false);
    return false;
  }
}

async function loadMyMemberProfile(){
  if(!supabase || !currentUser){ currentMember=null; return null; }
  const {data,error}=await supabase.from('members')
    .select('*')
    .eq('auth_user_id',currentUser.id)
    .maybeSingle();
  if(error){ console.error(error); currentMember=null; return null; }
  currentMember=data?{
    id:Number(data.id),name:data.name,group:data.group_name,role:data.role,status:data.status,
    authUserId:data.auth_user_id
  }:null;
  return currentMember;
}




function renderAuthState(){
  const out=$('authSignedOut'), inn=$('authSignedIn'), status=$('authStatus');
  if(!out||!inn)return;
  if(currentUser){
    out.style.display='none'; inn.style.display='block';
    $('authEmailView').textContent=currentUser.email||'로그인됨';
    $('authProfileView').innerHTML=currentMember
      ? `<div style="margin-top:8px;font-weight:800">${currentMember.name}</div>
         <span class="${currentMember.status==='승인대기'?'pending-badge':'profile-badge'}">
           ${currentMember.group} · ${currentMember.role} · ${currentMember.status}
         </span>`
      : `<div class="sub" style="margin-top:8px">회원 정보를 등록해주세요.</div>`;
    if(status) status.textContent='로그인됨';
  }else{
    out.style.display='block'; inn.style.display='none';
    if(status) status.textContent=remoteReady?'로그인이 필요합니다.':'';
  }
  applyRoleVisibility();
}

function applyRoleVisibility(){
  const approved=currentMember?.status==='활동중';
  const role=approved ? (currentMember?.role||'회원') : '회원';
  const isAdmin=role==='관리자';
  const isStaff=isAdmin || role==='운영진';

  // Cloud connection credentials/settings: administrator only.
  const cloudBox=$('cloudAdminBox');
  if(cloudBox) cloudBox.style.display=isAdmin?'block':'none';

  // Management areas: staff (운영진/관리자) only.
  if($('addMember')) $('addMember').style.display=isStaff?'inline-block':'none';
  if($('newMatchBtn')) $('newMatchBtn').style.display=isStaff?'inline-block':'none';
  if($('deleteModeBtn')) $('deleteModeBtn').style.display=isStaff?'inline-block':'none';
  document.querySelectorAll('.edit-match,.edit-member').forEach(el=>el.style.display=isStaff?'block':'none');
}

function subscribeRealtime(){
  if(!supabase)return;
  if(realtimeChannel) supabase.removeChannel(realtimeChannel);
  realtimeChannel=supabase
    .channel('jasnal-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'matches'},scheduleRemoteReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'members'},scheduleRemoteReload)
    .on('postgres_changes',{event:'*',schema:'public',table:'votes'},scheduleRemoteReload)
    .subscribe();
}

function scheduleRemoteReload(){
  clearTimeout(remoteReloadTimer);
  remoteReloadTimer=setTimeout(()=>loadRemoteState(),250);
}

async function loadRemoteState(){
  if(!supabase)return;
  try{
    const [{data:matches,error:me},{data:members,error:mbe},{data:votes,error:ve}] = await Promise.all([
      supabase.from('matches').select('*').order('match_date',{ascending:true}),
      supabase.from('members').select('*').order('name',{ascending:true}),
      supabase.from('votes').select('*')
    ]);
    if(me)throw me;if(mbe)throw mbe;if(ve)throw ve;

    const mine=currentUser?.id||deviceId();
    const memberNameByAuthId={};
    for(const m of members||[]){
      if(m.auth_user_id) memberNameByAuthId[m.auth_user_id]=m.name;
    }

    const voteGroups={};
    for(const v of votes||[]){
      if(!voteGroups[v.match_id]) voteGroups[v.match_id]={
        yes:0,no:0,maybe:0,myVote:null,
        yesNames:[],noNames:[],maybeNames:[]
      };
      const g=voteGroups[v.match_id];
      const displayName=memberNameByAuthId[v.voter_id] || '회원';
      if(v.vote==='yes'){ g.yes++; g.yesNames.push(displayName); }
      if(v.vote==='no'){ g.no++; g.noNames.push(displayName); }
      if(v.vote==='maybe'){ g.maybe++; g.maybeNames.push(displayName); }
      if(v.voter_id===mine)g.myVote=v.vote;
    }

    state.matches=(matches||[]).map(m=>({
      id:Number(m.id),
      title:m.title,
      date:m.match_date,
      time:(m.start_time||'').slice(0,5),
      endTime:(m.end_time||'').slice(0,5),
      place:m.place,
      memo:m.memo||'',
      attendance:voteGroups[m.id]||{yes:0,no:0,maybe:0,myVote:null,yesNames:[],noNames:[],maybeNames:[]}
    }));

    state.members=(members||[]).map(m=>({
      id:Number(m.id),
      name:m.name,
      group:m.group_name,
      role:m.role,
      status:m.status,
      authUserId:m.auth_user_id||null
    }));

    saveState();
    rebuildEventsFromMatches();
    renderCalendar();
    renderMatches();
    renderMembers();
    refreshHome();
    applyRoleVisibility();
    setSyncStatus('Cloud 연결됨 · 최신 데이터',true);
  }catch(err){
    console.error(err);
    setSyncStatus('동기화 오류: '+(err?.message||'다시 시도하세요.'),false);
  }
}

async function remoteUpsertMatch(item){
  if(!remoteReady)return;
  const row={
    id:item.id,title:item.title,match_date:item.date,start_time:item.time,
    end_time:item.endTime||null,place:item.place,memo:item.memo||''
  };
  const {error}=await supabase.from('matches').upsert(row);
  if(error)throw error;
}

async function remoteDeleteMatch(id){
  if(!remoteReady)return;
  const {error}=await supabase.from('matches').delete().eq('id',id);
  if(error)throw error;
}

async function remoteSetVote(matchId,vote){
  if(!remoteReady || !currentUser) throw new Error('로그인이 필요합니다.');
  const voter=currentUser.id;
  if(!vote){
    const {error}=await supabase.from('votes').delete().eq('match_id',matchId).eq('voter_id',voter);
    if(error)throw error;
  }else{
    const {error}=await supabase.from('votes').upsert({match_id:matchId,voter_id:voter,vote});
    if(error)throw error;
  }
}

async function remoteUpsertMember(item){
  if(!remoteReady)return;
  const {error}=await supabase.from('members').upsert({
    id:item.id,name:item.name,group_name:item.group,role:item.role,status:item.status,
    auth_user_id:item.authUserId||null
  });
  if(error)throw error;
}

async function remoteDeleteMember(id){
  if(!remoteReady)return;
  const {error}=await supabase.from('members').delete().eq('id',id);
  if(error)throw error;
}


function saveState(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      matches: state.matches,
      members: state.members
    }));
  }catch(e){}
}

function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)return;
    const saved=JSON.parse(raw);
    if(Array.isArray(saved.matches)) state.matches=saved.matches;
    if(Array.isArray(saved.members)){
      state.members=saved.members.map((m,i)=>typeof m==='string'
        ? {id:1000+i,name:m,group:'1그룹',role:'회원',status:'활동중'}
        : m);
    }
  }catch(e){}
}

const pad=n=>String(n).padStart(2,'0');
const october2026 = [
  null,
  ['오전','오후','휴무'], // 1
  ['오전','휴무','오후'], // 2
  ['오전','휴무','오후'], // 3
  ['휴무','오전','오후'], // 4

];

// From 2026-11-01 onward only, continue the cycle from the exact 10/31 state.
// 1G: 10/30~31 afternoon -> 11/1~2 afternoon -> 11/3~4 off
// 2G: 10/28~31 morning   -> 11/1~2 off       -> 11/3~6 afternoon
// 3G: 10/30~31 off       -> 11/1~4 morning
const cycle = ['오전','오전','오전','오전','휴무','휴무','오후','오후','오후','오후','휴무','휴무'];
const continuationBase = Date.UTC(2026,10,1);
const nov1CycleIndexes = [8,4,0];

function getScheduleForDate(k){
  const [y,m,d] = k.split('-').map(Number);

  // October 2026: NEVER calculate. Use the supplied table exactly.
  if(y === 2026 && m === 10){
    return october2026[d].slice();
  }

  // November 2026 onward: calculate as continuation of 10/31.
  const current = Date.UTC(y,m-1,d);
  const diffDays = Math.floor((current - continuationBase) / 86400000);
  return nov1CycleIndexes.map(baseIdx => {
    const idx = ((baseIdx + diffDays) % cycle.length + cycle.length) % cycle.length;
    return cycle[idx];
  });
}

const dateKey=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const $=id=>document.getElementById(id);

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.screen===id));
}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>showScreen(b.dataset.screen)));
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>showScreen(b.dataset.go)));

$('homeVoteListBtn').addEventListener('click',()=>{
  const next=getNextMatch();
  if(!next){ alert('등록된 경기가 없습니다.'); return; }
  openVoteListModal(next.id);
});

$('closeVoteListModal').addEventListener('click',closeVoteListModal);
$('voteListModal').addEventListener('click',e=>{
  if(e.target===$('voteListModal')) closeVoteListModal();
});

document.querySelectorAll('.vote').forEach(btn=>{
  btn.addEventListener('click',async ()=>{
    const next=getNextMatch();
    if(!next)return;
    if(isMatchClosed(next)){ alert('경기가 종료되어 투표가 마감되었습니다.'); return; }
    if(remoteReady && !currentUser){ alert('로그인 후 투표할 수 있습니다.'); return; }
    if(remoteReady && !isApproved()){ alert('가입 승인 후 투표할 수 있습니다.'); return; }
    if(!next.attendance)next.attendance={yes:0,no:0,maybe:0,myVote:null,yesNames:[],noNames:[],maybeNames:[]};
    const map={참석:'yes',불참:'no',미정:'maybe'};
    const vote=map[btn.dataset.vote];
    const prev=next.attendance.myVote;
    if(prev===vote){
      if(next.attendance[vote]>0)next.attendance[vote]--;
      next.attendance.myVote=null;
    }else{
      if(prev && next.attendance[prev]>0)next.attendance[prev]--;
      next.attendance[vote]++;
      next.attendance.myVote=vote;
    }
    saveState();
    if(remoteReady){
      try{ await remoteSetVote(next.id,next.attendance.myVote); }catch(err){ setSyncStatus('투표 동기화 실패: '+err.message,false); }
    }
    renderMatches();
  });
});

function classFor(v){
  if(v==='오전') return 'morning';
  if(v==='오후') return 'afternoon';
  if(v==='휴무') return 'off';
  return '';
}

function renderCalendar(){
  $('monthTitle').textContent=`${state.year}년 ${state.month+1}월`;
  const grid=$('calendarGrid');
  grid.innerHTML='';
  const first=new Date(Date.UTC(state.year,state.month,1)).getUTCDay();
  const days=new Date(Date.UTC(state.year,state.month+1,0)).getUTCDate();

  for(let i=0;i<first;i++){
    const blank=document.createElement('div');
    blank.className='day blank';
    grid.appendChild(blank);
  }

  for(let d=1;d<=days;d++){
    const k=dateKey(state.year,state.month,d);
    const dow=new Date(Date.UTC(state.year,state.month,d)).getUTCDay();
    const btn=document.createElement('button');
    btn.className='day'+(k===state.selected?' selected':'');
    btn.type='button';

    const num=document.createElement('div');
    num.className='day-num';
    if(dow===0||dow===6) num.classList.add('sun');
    if(dow===5) num.classList.add('fri');
    num.textContent=d;
    btn.appendChild(num);

    getScheduleForDate(k).forEach((v,i)=>{
      if(v==='미정') return;
      const tag=document.createElement('span');
      tag.className='tag '+classFor(v);
      tag.textContent=`${i+1}G ${v}`;
      btn.appendChild(tag);
    });

    if(state.events[k]?.length){
      const dot=document.createElement('span');
      dot.className='dot';
      btn.appendChild(dot);
    }

    btn.addEventListener('click',()=>selectDate(k));
    grid.appendChild(btn);
  }
}

function selectDate(k){
  state.selected=k;
  renderCalendar();
  const [y,m,d]=k.split('-').map(Number);
}


$('prevMonth').addEventListener('click',()=>{
  state.month--;
  if(state.month<0){state.month=11;state.year--;}
  selectDate(dateKey(state.year,state.month,1));
});

$('nextMonth').addEventListener('click',()=>{
  state.month++;
  if(state.month>11){state.month=0;state.year++;}
  selectDate(dateKey(state.year,state.month,1));
});




function rebuildEventsFromMatches(){
  state.events = {};
  state.matches.forEach(m=>{
    const text = `${m.title} ${m.time}${m.endTime ? `~${m.endTime}` : ''} · ${m.place}`;
    (state.events[m.date]||(state.events[m.date]=[])).push(text);
  });
}

function formatKoreanDate(dateStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const dow=['일','월','화','수','목','금','토'][new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  return `${m}월 ${d}일 (${dow})`;
}

function parseLocalDateTime(dateStr,timeStr){
  const [y,m,d]=dateStr.split('-').map(Number);
  const [hh,mm]=(timeStr||'00:00').split(':').map(Number);
  return new Date(y,m-1,d,hh||0,mm||0,0,0);
}

function getMatchEndDate(match){
  // If no end time is entered, fall back to start time.
  return parseLocalDateTime(match.date,match.endTime||match.time);
}

function isMatchClosed(match){
  return new Date() >= getMatchEndDate(match);
}

function getNextMatch(){
  // Keep the current match on the home screen until its END time.
  return [...state.matches]
    .sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))
    .find(m => !isMatchClosed(m)) || null;
}

function refreshHome(){
  const next=getNextMatch();
  const titleEl=$('homeNextMatchTitle');
  const placeEl=$('homeNextMatchPlace');
  const ddayEl=$('homeNextMatchDday');

  if(!next){
    titleEl.textContent='등록된 경기가 없습니다.';
    placeEl.textContent='';
    ddayEl.style.display='none';
    document.querySelectorAll('.vote').forEach(b=>{
      const strong=b.querySelector('strong');
      if(strong) strong.textContent='0';
      b.classList.remove('active');
      b.disabled=true;
    });
    $('voteMsg').textContent='경기를 등록하면 참석 투표가 표시됩니다.';
    return;
  }

  const homeClosed=isMatchClosed(next);
  document.querySelectorAll('.vote').forEach(b=>b.disabled=homeClosed);

  const [y,m,d]=next.date.split('-').map(Number);
  const dow=['일','월','화','수','목','금','토'][new Date(Date.UTC(y,m-1,d)).getUTCDay()];
  titleEl.textContent=`${m}월 ${d}일 (${dow}) ${next.time}`;
  placeEl.textContent=next.place;

  const now=new Date();
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const target=new Date(y,m-1,d);
  const diff=Math.round((target-today)/86400000);
  ddayEl.style.display='inline-block';
  ddayEl.textContent=diff===0?'D-DAY':(diff>0?`D-${diff}`:`D+${Math.abs(diff)}`);

  if(!next.attendance) next.attendance={yes:0,no:0,maybe:0,myVote:null};
  const votes=document.querySelectorAll('.vote');
  const vals=[next.attendance.yes||0,next.attendance.no||0,next.attendance.maybe||0];
  const map={참석:'yes',불참:'no',미정:'maybe'};
  votes.forEach((b,i)=>{
    const strong=b.querySelector('strong');
    if(strong)strong.textContent=vals[i];
    b.classList.toggle('active', next.attendance.myVote===map[b.dataset.vote]);
  });
  $('voteMsg').textContent=homeClosed
    ? '경기 종료 · 투표 마감'
    : (next.attendance.myVote
      ? `내 선택: ${{yes:'참석',no:'불참',maybe:'미정'}[next.attendance.myVote]}`
      : '참석 여부를 선택하세요.');
}


function openVoteListModal(matchId){
  if(remoteReady && !currentUser){
    alert('로그인 후 볼 수 있습니다.');
    return;
  }
  if(remoteReady && !isApproved()){
    alert('가입 승인 후 볼 수 있습니다.');
    return;
  }

  const m=state.matches.find(x=>x.id===matchId);
  if(!m)return;

  const a=m.attendance||{yes:0,no:0,maybe:0,yesNames:[],noNames:[],maybeNames:[]};
  $('voteListMatchInfo').textContent=`${formatKoreanDate(m.date)} · ${m.time} · ${m.place}`;

  const renderNames=(id,names)=>{
    const el=$(id);
    const safe=(names||[]).filter(Boolean);
    el.innerHTML=safe.length
      ? safe.map(n=>`<span class="vote-name">${n}</span>`).join('')
      : '<span class="vote-empty">없음</span>';
  };

  $('voteYesTitle').textContent=`참석 ${a.yes||0}명`;
  $('voteNoTitle').textContent=`불참 ${a.no||0}명`;
  $('voteMaybeTitle').textContent=`미정 ${a.maybe||0}명`;
  renderNames('voteYesList',a.yesNames);
  renderNames('voteNoList',a.noNames);
  renderNames('voteMaybeList',a.maybeNames);

  $('voteListModal').classList.add('show');
  $('voteListModal').setAttribute('aria-hidden','false');
}

function closeVoteListModal(){
  $('voteListModal').classList.remove('show');
  $('voteListModal').setAttribute('aria-hidden','true');
}

let matchListMode='upcoming';

function setMatchListMode(mode){
  matchListMode=mode==='past'?'past':'upcoming';
  $('upcomingMatchTab').classList.toggle('active',matchListMode==='upcoming');
  $('pastMatchTab').classList.toggle('active',matchListMode==='past');
  if($('deleteModeBtn')) $('deleteModeBtn').style.display=(matchListMode==='past'?'none':(isManager()?'inline-block':'none'));
  if(matchListMode==='past') deleteMode=false;
  renderMatches();
}

$('upcomingMatchTab').addEventListener('click',()=>setMatchListMode('upcoming'));
$('pastMatchTab').addEventListener('click',()=>setMatchListMode('past'));

function renderMatches(){
  rebuildEventsFromMatches();
  renderCalendar();
  refreshHome();
  const all=[...state.matches];
  const sorted=(matchListMode==='past'
    ? all.filter(m=>isMatchClosed(m)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))
    : all.filter(m=>!isMatchClosed(m)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))
  );

  $('matchList').innerHTML=sorted.length ? sorted.map(m=>`
    <div class="list-item">
      <div class="row">
        <div>
          <div style="font-weight:800">${m.title}</div>
          <div class="sub" style="margin-top:5px">${formatKoreanDate(m.date)} · ${m.time}${m.endTime?` ~ ${m.endTime}`:''}</div>
          <div class="sub" style="margin-top:3px">${m.place}</div>
          ${m.memo?`<div class="sub" style="margin-top:5px">메모: ${m.memo}</div>`:''}
        </div>
        <span class="pill">${isMatchClosed(m)?'마감':'경기'}</span>
      </div>
      <div class="attendance-grid">
        <button class="attendance-btn ${m.attendance?.myVote==='yes'?'active':''}" data-id="${m.id}" data-vote="yes" type="button" ${isMatchClosed(m)?'disabled':''}>참석<br>${m.attendance?.yes||0}</button>
        <button class="attendance-btn ${m.attendance?.myVote==='no'?'active':''}" data-id="${m.id}" data-vote="no" type="button" ${isMatchClosed(m)?'disabled':''}>불참<br>${m.attendance?.no||0}</button>
        <button class="attendance-btn ${m.attendance?.myVote==='maybe'?'active':''}" data-id="${m.id}" data-vote="maybe" type="button" ${isMatchClosed(m)?'disabled':''}>미정<br>${m.attendance?.maybe||0}</button>
      </div>
      <div class="attendance-note">${isMatchClosed(m)
        ? '경기 종료 · 투표 마감'
        : (m.attendance?.myVote ? '내 선택: '+({yes:'참석',no:'불참',maybe:'미정'}[m.attendance.myVote]) : '참석 여부를 선택하세요.')}</div>
      <button class="attendance-view-btn vote-list-btn" data-id="${m.id}" type="button">투표 인원 보기</button>
      <div class="match-actions">
        ${(!isMatchClosed(m) && isManager())?`<button class="secondary edit-match" data-id="${m.id}">수정</button>`:''}
        <button class="secondary open-calendar-match" data-date="${m.date}">캘린더 보기</button>
      </div>
      <button class="delete-pick" data-id="${m.id}" type="button" hidden>이 경기 삭제</button>
    </div>`).join('')
    : `<div class="card"><div class="sub">${matchListMode==='past'?'지난 경기가 없습니다.':'예정된 경기가 없습니다.'}</div></div>`;

  document.querySelectorAll('.edit-match').forEach(b=>b.addEventListener('click',()=>openMatchModal(Number(b.dataset.id))));
  document.querySelectorAll('.attendance-btn').forEach(b=>b.addEventListener('click',async ()=>{
    const id=Number(b.dataset.id);
    const vote=b.dataset.vote;
    if(remoteReady && !currentUser){ alert('로그인 후 투표할 수 있습니다.'); return; }
    if(remoteReady && !isApproved()){ alert('가입 승인 후 투표할 수 있습니다.'); return; }
    const m=state.matches.find(x=>x.id===id);
    if(!m)return;
    if(isMatchClosed(m)){ alert('경기가 종료되어 투표가 마감되었습니다.'); return; }
    if(!m.attendance)m.attendance={yes:0,no:0,maybe:0,myVote:null,yesNames:[],noNames:[],maybeNames:[]};

    const prev=m.attendance.myVote;
    if(prev===vote){
      if(m.attendance[vote]>0)m.attendance[vote]--;
      m.attendance.myVote=null;
    }else{
      if(prev && m.attendance[prev]>0)m.attendance[prev]--;
      m.attendance[vote]++;
      m.attendance.myVote=vote;
    }
    saveState();
    if(remoteReady){
      try{ await remoteSetVote(id,m.attendance.myVote); }catch(err){ setSyncStatus('투표 동기화 실패: '+err.message,false); }
    }
    renderMatches();
  }));
  document.querySelectorAll('.vote-list-btn').forEach(b=>b.addEventListener('click',()=>{
    openVoteListModal(Number(b.dataset.id));
  }));
  document.querySelectorAll('.open-calendar-match').forEach(b=>b.addEventListener('click',()=>{
    const [y,m,d]=b.dataset.date.split('-').map(Number);
    state.year=y;state.month=m-1;state.selected=b.dataset.date;
    showScreen('calendar');renderCalendar();
  }));
  if(typeof applyDeleteMode==='function') applyDeleteMode();
  applyRoleVisibility();
}

function openMatchModal(id=null, presetDate=null){
  const editing=id!==null;
  $('matchModalTitle').textContent=editing?'경기 수정':'경기 등록';
  $('editDeleteWrap').style.display=editing?'block':'none';
  if(editing){
    const m=state.matches.find(x=>x.id===id);
    if(!m)return;
    $('matchId').value=m.id;
    $('matchTitle').value=m.title;
    $('matchDate').value=m.date;
    $('matchTime').value=m.time;
    $('matchEndTime').value=m.endTime||'';
    $('matchPlace').value=m.place;
    $('matchMemo').value=m.memo||'';
  }else{
    $('matchId').value='';
    $('matchTitle').value='정기 경기';
    $('matchDate').value=presetDate||state.selected||'2026-11-21';
    $('matchTime').value='20:00';
    $('matchEndTime').value='22:00';
    $('matchPlace').value='영종 풋살장 A구장';
    $('matchMemo').value='';
  }
  $('matchModal').classList.add('show');
  $('matchModal').setAttribute('aria-hidden','false');
}

function closeMatchModal(){
  $('matchModal').classList.remove('show');
  $('matchModal').setAttribute('aria-hidden','true');
}

$('newMatchBtn').addEventListener('click',()=>{ if(['운영진','관리자'].includes(currentMember?.role)) openMatchModal(); });
let deleteMode=false;
function applyDeleteMode(){
  document.querySelectorAll('.delete-pick').forEach(btn=>{
    const m=state.matches.find(x=>x.id===Number(btn.dataset.id));
    const show=deleteMode && m && !isMatchClosed(m) && matchListMode==='upcoming';
    btn.hidden=!show;
    btn.style.display=show?'block':'none';
  });
  $('deleteModeBtn').textContent=deleteMode?'취소':'삭제';
}
$('deleteModeBtn').addEventListener('click',()=>{
  if(!isManager()){ alert('운영진 이상 권한이 필요합니다.'); return; }
  deleteMode=!deleteMode;
  applyDeleteMode();
});
$('matchList').addEventListener('click',async e=>{
  const btn=e.target.closest('.delete-pick');
  if(!btn)return;
  const id=Number(btn.dataset.id);
  const m=state.matches.find(x=>x.id===id);
  if(!m)return;
  if(confirm(`${m.title} (${m.date}) 경기를 삭제할까요?`)){
    state.matches=state.matches.filter(x=>x.id!==id);
    saveState();
    if(remoteReady){ try{ await remoteDeleteMatch(id); }catch(err){ setSyncStatus('삭제 동기화 실패: '+err.message,false); } }
    deleteMode=false;
    renderMatches();
  }
});

$('closeMatchModal').addEventListener('click',closeMatchModal);
$('matchModal').addEventListener('click',e=>{if(e.target===$('matchModal'))closeMatchModal();});

$('matchForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const item={
    id:$('matchId').value?Number($('matchId').value):Date.now(),
    title:$('matchTitle').value.trim(),
    date:$('matchDate').value,
    time:$('matchTime').value,
    endTime:$('matchEndTime').value,
    place:$('matchPlace').value.trim(),
    memo:$('matchMemo').value.trim(),
    attendance:{yes:0,no:0,maybe:0,myVote:null}
  };
  if(!item.title||!item.date||!item.time||!item.place)return;
  const idx=state.matches.findIndex(x=>x.id===item.id);
  if(idx>=0){
    item.attendance=state.matches[idx].attendance||{yes:0,no:0,maybe:0,myVote:null};
    state.matches[idx]=item;
  }
  else state.matches.push(item);
  saveState();
  if(remoteReady){
    try{ await remoteUpsertMatch(item); }catch(err){ setSyncStatus('경기 저장 동기화 실패: '+err.message,false); }
  }
  closeMatchModal();
  renderMatches();
});

$('deleteMatchBtn').addEventListener('click',async ()=>{
  const id=Number($('matchId').value);
  if(!id)return;
  if(confirm('이 경기를 삭제할까요?')){
    state.matches=state.matches.filter(x=>x.id!==id);
    saveState();
    if(remoteReady){ try{ await remoteDeleteMatch(id); }catch(err){ setSyncStatus('삭제 동기화 실패: '+err.message,false); } }
    closeMatchModal();
    renderMatches();
  }
});


function renderMembers(){
  const q=$('memberSearch').value.trim().toLowerCase();
  const group=$('memberGroupFilter').value;
  const status=$('memberStatusFilter').value;

  const arr=state.members.filter(m=>{
    const name=(m.name||'').toLowerCase();
    return (!q || name.includes(q))
      && (!group || m.group===group)
      && (!status || m.status===status);
  });

  $('memberCount').textContent=`전체 ${state.members.length}명 · 표시 ${arr.length}명`;
  if($('moreMemberCount')) $('moreMemberCount').textContent=`회원 ${state.members.length}명`;

  $('memberList').innerHTML=arr.length ? arr.map(m=>`
    <div class="list-item">
      <div class="member-row">
        <div>
          <div style="font-weight:800;font-size:16px">${m.name}</div>
          <div class="member-meta">
            <span class="member-chip">${m.group}</span>
            <span class="member-chip">${m.role}</span>
            <span class="member-chip">${m.status}</span>
          </div>
        </div>
      </div>
      ${(isManager() || m.authUserId===currentUser?.id) ? `
      <div class="member-card-actions">
        <button class="secondary edit-member" data-id="${m.id}" type="button">수정</button>
      </div>` : ''}
    </div>`).join('')
    : '<div class="card"><div class="sub">조건에 맞는 회원이 없습니다.</div></div>';


  const pending=state.members.filter(m=>m.status==='승인대기');
  const queue=$('approvalQueue');
  if(queue){
    queue.style.display=isManager() && pending.length ? 'block' : 'none';
    $('approvalList').innerHTML=pending.map(m=>`
      <div class="list-item">
        <div style="font-weight:800">${m.name}</div>
        <div class="member-meta">
          <span class="member-chip">${m.group}</span>
          <span class="member-chip">가입대기</span>
        </div>
        <div class="approval-actions">
          <button class="primary approve-member" data-id="${m.id}" type="button" style="margin-top:0">승인</button>
          <button class="secondary reject-member" data-id="${m.id}" type="button">거절</button>
        </div>
      </div>`).join('');
  }

  document.querySelectorAll('.approve-member').forEach(b=>b.addEventListener('click',async ()=>{
    const m=state.members.find(x=>x.id===Number(b.dataset.id));
    if(!m || !isManager())return;
    m.status='활동중';
    m.role='회원';
    saveState();
    try{ await remoteUpsertMember(m); }catch(err){ setSyncStatus('승인 동기화 실패: '+err.message,false); }
    renderMembers();
  }));

  document.querySelectorAll('.reject-member').forEach(b=>b.addEventListener('click',async ()=>{
    const id=Number(b.dataset.id);
    const m=state.members.find(x=>x.id===id);
    if(!m || !isManager())return;
    if(confirm(`${m.name} 가입 신청을 거절할까요?`)){
      state.members=state.members.filter(x=>x.id!==id);
      saveState();
      try{ await remoteDeleteMember(id); }catch(err){ setSyncStatus('거절 동기화 실패: '+err.message,false); }
      renderMembers();
    }
  }));

  document.querySelectorAll('.edit-member').forEach(b=>{
    b.addEventListener('click',()=>openMemberModal(Number(b.dataset.id)));
  });
  applyRoleVisibility();
}

function openMemberModal(id=null){
  const editing=id!==null;
  $('memberModalTitle').textContent=editing?'회원 수정':'회원 등록';
  $('memberDeleteWrap').style.display=(editing && isManager())?'block':'none';
  const roleField=$('memberRole');
  const statusField=$('memberStatus');
  const managerMode=isManager();
  roleField.disabled=!managerMode;
  statusField.disabled=!managerMode;

  if(editing){
    const m=state.members.find(x=>x.id===id);
    if(!m)return;
    $('memberId').value=m.id;
    $('memberAuthUserId').value=m.authUserId||'';
    $('memberName').value=m.name||'';
    $('memberGroup').value=m.group||'1그룹';
    $('memberRole').value=m.role||'회원';
    $('memberStatus').value=m.status||'활동중';
  }else{
    $('memberId').value='';
    $('memberAuthUserId').value=currentUser?.id||'';
    $('memberName').value='';
    $('memberGroup').value='1그룹';
    $('memberRole').value='회원';
    $('memberStatus').value=currentUser ? '승인대기' : '활동중';
  }

  $('memberModal').classList.add('show');
  $('memberModal').setAttribute('aria-hidden','false');
}

function closeMemberModal(){
  $('memberModal').classList.remove('show');
  $('memberModal').setAttribute('aria-hidden','true');
}

$('addMember').addEventListener('click',()=>{ if(['운영진','관리자'].includes(currentMember?.role)) openMemberModal(); });
$('closeMemberModal').addEventListener('click',closeMemberModal);
$('memberModal').addEventListener('click',e=>{
  if(e.target===$('memberModal')) closeMemberModal();
});

$('memberForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const editingId=$('memberId').value ? Number($('memberId').value) : null;
  const existing=editingId ? state.members.find(x=>x.id===editingId) : null;
  const selfRegistration=!isManager() && (!existing || existing.authUserId===currentUser?.id);
  const item={
    id:editingId || Date.now(),
    name:$('memberName').value.trim(),
    group:$('memberGroup').value,
    role:selfRegistration ? (existing?.role||'회원') : $('memberRole').value,
    status:selfRegistration ? (existing?.status||'승인대기') : $('memberStatus').value,
    authUserId:$('memberAuthUserId').value||null
  };
  if(!item.name)return;

  const idx=state.members.findIndex(x=>x.id===item.id);
  if(idx>=0) state.members[idx]=item;
  else state.members.push(item);

  saveState();
  if(remoteReady){
    try{
      await remoteUpsertMember(item);
      if(currentUser && item.authUserId===currentUser.id){
        currentMember=item;
        renderAuthState();
      }
    }catch(err){ setSyncStatus('회원 저장 동기화 실패: '+err.message,false); }
  }
  closeMemberModal();
  renderMembers();
});

$('deleteMemberBtn').addEventListener('click',async ()=>{
  const id=Number($('memberId').value);
  if(!id)return;
  const m=state.members.find(x=>x.id===id);
  if(m && confirm(`${m.name} 회원을 삭제할까요?`)){
    state.members=state.members.filter(x=>x.id!==id);
    saveState();
    if(remoteReady){
      try{ await remoteDeleteMember(id); }catch(err){ setSyncStatus('회원 삭제 동기화 실패: '+err.message,false); }
    }
    closeMemberModal();
    renderMembers();
  }
});

$('memberSearch').addEventListener('input',renderMembers);
$('memberGroupFilter').addEventListener('change',renderMembers);
$('memberStatusFilter').addEventListener('change',renderMembers);



$('loginBtn').addEventListener('click',async ()=>{
  if(!supabase){ $('authStatus').textContent='먼저 Cloud 연결을 완료하세요.'; return; }
  const email=$('authEmail').value.trim(), password=$('authPassword').value;
  if(!email||!password){ $('authStatus').textContent='이메일과 비밀번호를 입력하세요.'; return; }
  $('authStatus').textContent='로그인 중...';
  const {error}=await supabase.auth.signInWithPassword({email,password});
  if(error){ $('authStatus').textContent='로그인 실패: '+error.message; }
});

$('signupBtn').addEventListener('click',async ()=>{
  if(!supabase){ $('authStatus').textContent='먼저 Cloud 연결을 완료하세요.'; return; }
  const email=$('authEmail').value.trim(), password=$('authPassword').value;
  if(!email||password.length<6){ $('authStatus').textContent='이메일과 6자 이상 비밀번호를 입력하세요.'; return; }
  $('authStatus').textContent='가입 처리 중...';
  const {data,error}=await supabase.auth.signUp({email,password});
  if(error){ $('authStatus').textContent='회원가입 실패: '+error.message; return; }
  if(data.session){
    currentUser=data.user;
    renderAuthState();
    openMemberModal();
  }else{
    $('authStatus').textContent='가입 완료. 이메일 인증 후 로그인하세요.';
  }
});

$('logoutBtn').addEventListener('click',async ()=>{
  if(supabase) await supabase.auth.signOut();
});

$('editMyProfileBtn').addEventListener('click',()=>{
  if(currentMember) openMemberModal(currentMember.id);
  else openMemberModal();
});

$('connectSupabase').addEventListener('click',async ()=>{
  if(currentMember?.role!=='관리자'){ setSyncStatus('관리자만 Cloud 연결 설정을 변경할 수 있습니다.',false); return; }
  const url=$('supabaseUrl').value.trim();
  const key=$('supabaseKey').value.trim();
  if(!url || !key){ setSyncStatus('Project URL과 Key를 입력하세요.',false); return; }
  localStorage.setItem(SB_URL_KEY,url);
  localStorage.setItem(SB_ANON_KEY,key);
  setSyncStatus('연결 확인 중...');
  await initSupabase();
setInterval(()=>{
  refreshHome();
  renderMatches();
},60000);
renderAuthState();
});

$('disconnectSupabase').addEventListener('click',()=>{
  if(currentMember?.role!=='관리자'){ setSyncStatus('관리자만 Cloud 연결 설정을 변경할 수 있습니다.',false); return; }
  localStorage.removeItem(SB_URL_KEY);
  localStorage.removeItem(SB_ANON_KEY);
  if(realtimeChannel && supabase) supabase.removeChannel(realtimeChannel);
  realtimeChannel=null; supabase=null; remoteReady=false;
  $('supabaseUrl').value='';
  $('supabaseKey').value='';
  setSyncStatus('현재: 이 기기에만 저장');
});

loadState();
rebuildEventsFromMatches();
renderCalendar();
renderMatches();
renderMembers();
refreshHome();
initSupabase();
</script>
